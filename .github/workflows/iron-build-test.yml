name: Iron Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  iron_build_and_test:
    runs-on: ubuntu-latest
    container:
      image: ros:iron
    steps:
      - name: Update installed packages
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get -y upgrade
      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: yasmin yasmin_ros yasmin_factory yasmin_pcl yasmin_editor
          target-ros2-distro: iron
          coverage-result: false
